const API="https://script.google.com/macros/s/AKfycbxEw7MPjk2RDgRynfb22AnvCazaShRaMj8ZbrX5u4wNl_xn6tfpgbw0us92MHSQH8hjFQ/exec";  // ← 구글 Apps Script 웹 앱 URL을 여기에 붙여 넣으세요. 비어 있으면 이 기기에만 저장돼요.
const RK="pharmRanking";
function esc(t){return String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function cleanName(n){return String(n||"").replace(/[<>&"'`\\=+@]/g,"").replace(/\s+/g," ").trim().slice(0,8)}
function localList(){try{const a=JSON.parse(localStorage.getItem(RK)||"[]");return Array.isArray(a)?a:[]}catch(e){return[]}}
function callOnce(params){ // 스크립트 태그 방식(JSONP): 브라우저의 접속 차단(CORS)에 걸리지 않아요
 return new Promise((resolve,reject)=>{
  const cb="jp"+Date.now()+Math.floor(Math.random()*1e6);const sc=document.createElement("script");let done=false;
  const fin=()=>{done=true;clearTimeout(to);try{delete window[cb]}catch(e){window[cb]=undefined}sc.remove()};
  window[cb]=d=>{fin();resolve(d)};
  sc.onerror=()=>{if(done)return;fin();const e=new Error("load");e.name="LoadErr";reject(e)};
  const to=setTimeout(()=>{if(done)return;fin();const e=new Error("timeout");e.name="AbortError";reject(e)},15000);
  sc.src=API+"?"+new URLSearchParams(Object.assign({},params,{callback:cb})).toString();
  document.head.appendChild(sc)})}
async function viaFetch(params){
 const u=API+"?"+new URLSearchParams(params).toString();
 const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),20000);
 try{const r=await fetch(u,{signal:ctl.signal,redirect:"follow"});const t=await r.text();
  try{return JSON.parse(t)}catch(e){const m=t.match(/^[\w$]+\(([\s\S]*)\);?\s*$/);if(m)return JSON.parse(m[1]);throw new Error("bad")}}
 finally{clearTimeout(to)}}
let LASTERR={};
async function call(params){ // 1) fetch 방식 먼저 → 안 되면 2) 스크립트 방식
 try{return await viaFetch(params)}catch(e){LASTERR.b=(e&&e.name)||"err"}
 try{return await callOnce(params)}catch(e){LASTERR.a=(e&&e.name)||"err";throw e}}
function errInfo(e){return "(방법1: "+(LASTERR.a||"-")+" / 방법2: "+(LASTERR.b||"-")+" / 열린 방식: "+location.protocol+" / 인터넷: "+(navigator.onLine?"연결됨":"끊김")+")"}
async function diag(){
 $("card").innerHTML=`<h2>🔧 연결 점검</h2><p class="small" id="dg">점검 중... 최대 1분 걸려요 ⏳</p>`;$("ov").classList.add("show");
 const out=[];const t0=Date.now();
 out.push("열린 방식: "+location.protocol+" ("+(location.href.slice(0,40))+")");
 out.push("인터넷: "+(navigator.onLine?"연결됨":"끊김"));
 try{const d=await callOnce({action:"list"});out.push("방법1(스크립트): ✅ 성공 "+(Date.now()-t0)+"ms, 기록 "+(d.list||[]).length+"개")}catch(e){out.push("방법1(스크립트): ❌ "+((e&&e.name)||"err"))}
 const t1=Date.now();
 try{const d=await viaFetch({action:"list"});out.push("방법2(fetch): ✅ 성공 "+(Date.now()-t1)+"ms, 기록 "+(d.list||[]).length+"개")}catch(e){out.push("방법2(fetch): ❌ "+((e&&e.name)||"err")+" "+((e&&e.message)||""))}
 $("card").innerHTML=`<h2>🔧 연결 점검 결과</h2><div style="text-align:left;line-height:1.8;font-size:14px;background:#f6f6f6;padding:10px;border-radius:10px">${out.map(esc).join("<br>")}</div><p class="small">이 화면을 캡처해서 알려 주세요!</p><div class="row"><button class="btn" onclick="showStart()">게임으로</button></div>`}
async function getRank(){
 if(!API)return{ok:true,list:localList()};
 try{return await call({action:"list"})}catch(e){return{ok:false,err:"net"}}}
function rankTable(list,me){
 if(!list.length)return `<p class="small">아직 등록된 기록이 없어요. 첫 번째 주인공이 되어 보세요! 🥇</p>`;
 const md=["🥇","🥈","🥉"];let hit=false;
 return `<div class="rkw"><table class="rk"><tr><th>순위</th><th>닉네임</th><th>점수</th><th>손님</th></tr>${list.map((e,i)=>{const m=!hit&&me&&e.n===me.n&&e.s===me.s;if(m)hit=true;return `<tr class="${m?"me":""}"><td>${md[i]||i+1}</td><td>${esc(e.n)}</td><td>${e.s}</td><td>${e.c}명</td></tr>`}).join("")}</table></div>`}
async function showRanking(me,msg){
 $("card").innerHTML=`<div style="font-size:44px">🏆</div><h2>약사 랭킹 TOP 50</h2><p class="small" id="rkl">불러오는 중... ⏳</p>`;
 $("ov").classList.add("show");
 const r=await getRank();
 const body=r.ok?rankTable(r.list,me):`<p style="color:#b00"><b>랭킹을 불러오지 못했어요.</b><br>인터넷 연결이나 서버 주소를 확인해 주세요.</p>`;
 $("card").innerHTML=`<div style="font-size:44px">🏆</div><h2>약사 랭킹 TOP 50</h2>${msg?`<p><b>${msg}</b></p>`:""}${body}
 <p class="small">${API?"모두가 함께 보는 랭킹이에요.":"※ 서버 주소가 없어 이 기기에서만 보이는 랭킹이에요."}</p>
 <div class="row"><button class="btn" onclick="showStart()">게임으로</button><button class="btn" onclick="showRanking()">🔄 새로고침</button><button class="btn gray" onclick="diag()">🔧 연결 점검</button><button class="btn gray" onclick="resetRank()">관리자: 기록 지우기</button></div>`;
}
function lhash(n,p){let h=5381;const t=n+"|"+p;for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))>>>0;return String(h)}
async function regScore(){
 if(G.reg||G.busy)return;const n=cleanName($("nick").value);const pw=($("pw").value||"").trim();const m=$("rgmsg");
 const bad=t=>{m.style.color="#b00";m.textContent=t;$("regbtn").disabled=false;G.busy=false};
 if(!n){m.style.color="#b00";m.textContent="닉네임을 입력해 주세요! (최대 8글자)";return}
 if(pw.length<4||pw.length>20){m.style.color="#b00";m.textContent="비밀번호는 4~20글자로 정해 주세요.";return}
 G.busy=true;$("regbtn").disabled=true;m.style.color="#555";m.textContent="등록하는 중... ⏳";
 try{localStorage.setItem("pharmNick",n)}catch(e){}
 const cnt=Math.max(0,G.served-1);let list,status,best;
 if(!API){
  const r=localList(),h=lhash(n,pw),i=r.findIndex(e=>e.n===n);
  if(i>=0){if(r[i].h!==h)return bad("❌ 이미 있는 닉네임이에요. 비밀번호가 맞지 않아요!");
   if(G.score>r[i].s){r[i]={n,s:G.score,c:cnt,d:Date.now(),h};status="updated"}else{status="kept";best=r[i].s}}
  else{r.push({n,s:G.score,c:cnt,d:Date.now(),h});status="new"}
  r.sort((a,b)=>b.s-a.s||a.d-b.d);const top=r.slice(0,50);
  try{localStorage.setItem(RK,JSON.stringify(top))}catch(e){return bad("이 브라우저에서는 저장이 안 돼요.")}
  list=top.map(e=>({n:e.n,s:e.s,c:e.c}));
 }else{
  try{const r=await call({action:"submit",n,s:G.score,c:cnt,pw});
   if(!r.ok){return bad(r.err==="pw"?"❌ 이미 있는 닉네임이에요. 비밀번호가 맞지 않아요!":r.err==="pwlen"?"비밀번호는 4~20글자로 정해 주세요.":"등록하지 못했어요. 다시 시도해 주세요.")}
   list=r.list;status=r.status;best=r.best}
  catch(e){
   const info=errInfo(e);
   // 마지막 수단: 이미지 요청으로 등록 신호만 보내고(브라우저 차단에 안 걸림), 잠시 뒤 랭킹에서 내 기록을 확인
   try{new Image().src=API+"?"+new URLSearchParams({action:"submit",n,s:G.score,c:cnt,pw}).toString()}catch(_){}
   m.style.color="#555";m.textContent="연결이 느려요. 등록 결과를 확인하는 중... ⏳";
   await new Promise(r=>setTimeout(r,5000));
   let chk=null;try{chk=await call({action:"list"})}catch(_){}
   const me=chk&&chk.ok&&chk.list?chk.list.find(x=>x.n===n):null;
   if(me){list=chk.list;best=me.s;status=me.s>G.score?"kept":"new"}
   else return bad("서버에 연결하지 못했어요 [v14] "+info+" ← 이 화면을 캡처해서 보내 주세요")}}
 G.busy=false;G.reg=true;beep(660,.12);beep(880,.15);
 const place=list.findIndex(e=>e.n===n);
 const where=place>=0?`${place+1}위`:"50위 밖";
 const msg=status==="new"?`새로 등록됐어요! 현재 ${where} 🎉`:status==="updated"?`점수를 갱신했어요! 현재 ${where} 🚀`:`기존 최고 점수(${best}점)가 더 높아서 그대로 유지돼요. 현재 ${where}`;
 const sc=status==="kept"?best:G.score;
 showRanking({n,s:sc},msg);
}
async function resetRank(){
 if(!confirm("랭킹 기록을 모두 지울까요? 되돌릴 수 없어요."))return;
 if(!API){try{localStorage.removeItem(RK)}catch(e){}showRanking();return}
 const pw=prompt("관리자 비밀번호를 입력하세요. (서버 코드에 적은 ADMIN_PASSWORD)");if(!pw)return;
 try{const r=await call({action:"reset",pw});if(r.ok)showRanking(null,"랭킹을 초기화했어요.");else alert(r.err==="pw"?"비밀번호가 맞지 않아요.":"실패했어요.")}catch(e){alert("서버에 연결하지 못했어요.")}}
document.addEventListener("keydown",e=>{const id=document.activeElement&&document.activeElement.id;if(e.key==="Enter"&&(id==="nick"||id==="pw"))regScore()});
/* ---- 종료 ---- */
function end(clear){
 if(!G.run)return;G.run=false;clearInterval(G.iv);if(G.E)evCleanup();
 let best=0;try{best=+localStorage.getItem("pharmBest")||0;if(G.score>best){best=G.score;localStorage.setItem("pharmBest",best)}}catch(e){}
 const g=!clear?["😢","오늘은 여기까지!"]:G.score>=300?["🏆","전설의 약사"]:G.score>=180?["🥈","믿음직한 약사"]:["🌱","새내기 약사"];
 const ls=Object.keys(G.lessons);let nick0="";try{nick0=localStorage.getItem("pharmNick")||""}catch(e){}G.reg=false;G.busy=false;
 $("card").innerHTML=`<div style="font-size:50px">${g[0]}</div><h2>${clear?"영업 종료!":"신뢰도가 바닥났어요..."} ${g[1]}</h2>
 <p>⭐ 점수 <b>${G.score}</b> (최고 ${best}) · 응대한 손님 ${G.served-1+(clear?1:0)}명 · 실수 ${G.wrong}번 · 돌발상황 성공 ${G.evWin}번</p>
 <div style="text-align:left"><b>📋 오늘 배운 약 상식 (${ls.length}개)</b><ul class="ls">${ls.map(x=>"<li>"+x+"</li>").join("")}</ul>
 <p class="small">※ 수거함 위치와 분리배출 방법은 지역마다 조금 다를 수 있어요. 환경부·지자체 안내를 확인해요.</p></div>
 <div class="reg"><b>🏆 랭킹에 이름 남기기</b><br><br><input id="nick" maxlength="8" placeholder="닉네임 (최대 8글자)" value="${esc(nick0)}" autocomplete="off"><br><input id="pw" type="password" maxlength="20" placeholder="나만의 비밀번호 (4글자 이상)" autocomplete="off" style="margin-top:8px"><div class="small" style="margin-top:6px">같은 닉네임+비밀번호로 다시 등록하면 점수가 갱신돼요.<br>(더 높은 점수일 때만 바뀌어요 · 중요한 비밀번호는 쓰지 마세요!)</div><button class="btn" id="regbtn" style="margin-top:8px" onclick="regScore()">등록</button><div class="small" id="rgmsg" style="margin-top:6px;color:#b00"></div></div>
 <div class="row"><button class="btn" onclick="showStart()">다시 도전!</button><button class="btn gray" onclick="showRanking()">랭킹 보기</button></div>`;
 $("ov").classList.add("show");
}

 <div class="row"><button class="btn" onclick="start()">영업 시작! ▶</button><button class="btn gray" onclick="showRanking()">🏆 랭킹 보기</button><button class="btn gray" onclick="diag()">🔧 연결 점검</button></div>`;

}
